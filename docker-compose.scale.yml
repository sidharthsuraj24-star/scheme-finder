# Phase 1 scale stack: Redis + FastAPI match API (multi-instance ready).
# Usage (from repo root):
#   docker compose -f docker-compose.scale.yml up --build
# API:  http://localhost:8000
# Redis: localhost:6379  (REDIS_URL=redis://redis:6379/0 inside api)
#
# Optional cache: MATCH_CACHE_TTL_SEC=60 docker compose -f docker-compose.scale.yml up --build
# Scale API replicas: docker compose -f docker-compose.scale.yml up --build --scale api=2
#   (publish only one host port when scaling, or use a reverse proxy)

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_MAX: "60"
      RATE_LIMIT_WINDOW_SEC: "60"
      MATCH_CACHE_TTL_SEC: "0"
      ENV: development
      CORS_ORIGINS: "*"
    depends_on:
      redis:
        condition: service_healthy
