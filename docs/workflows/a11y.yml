# Copy to .github/workflows/a11y.yml (needs a token with the `workflow` scope —
# see docs/DATA_REFRESH.md for why workflow files live under docs/workflows/).
name: Accessibility (WCAG 2.2 AA regression)

on:
  pull_request:
    paths:
      - "frontend/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      # axe-core (WCAG 2.0–2.2 A/AA) over every route / wizard step / results /
      # saved profiles / ops in EN+HI+ML, desktop + 375px; fails on serious or
      # critical violations. Plus scripted keyboard / focus / lang / reflow checks.
      - name: Playwright a11y suite
        env:
          CI: "1"
          A11Y_REPORT_DIR: a11y-report
        run: npx playwright test

      - name: Summarise axe results
        if: always()
        run: node scripts/a11y-summarize.mjs a11y-report | tee a11y-summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: |
            frontend/a11y-report
            frontend/a11y-summary.txt
